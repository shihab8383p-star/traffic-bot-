<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Bot Monitor - Live Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .status-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 2s infinite;
            margin-right: 10px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .log-section {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }
        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .auto-refresh {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Traffic Bot Monitor</h1>
            <p><span class="status-indicator"></span>Bots are ACTIVE and running 24/7</p>
        </div>

        <div class="auto-refresh">
            <button class="refresh-btn" onclick="loadStats()">🔄 Refresh Stats</button>
            <p style="margin-top: 10px; opacity: 0.8;">Auto-refreshing every 5 seconds...</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">🌐 Total Visits</div>
                <div class="stat-value" id="totalVisits">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🖱️ Total Clicks</div>
                <div class="stat-value" id="totalClicks">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📜 Total Scrolls</div>
                <div class="stat-value" id="totalScrolls">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">✅ Sessions Completed</div>
                <div class="stat-value" id="sessionsCompleted">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📱 Mobile Visits</div>
                <div class="stat-value" id="mobileVisits">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">💻 Desktop Visits</div>
                <div class="stat-value" id="desktopVisits">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🌍 Active Proxies</div>
                <div class="stat-value" id="activeProxies">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">💰 Est. Earnings</div>
                <div class="stat-value" id="earnings">$0</div>
            </div>
        </div>

        <div class="log-section">
            <h3>📊 Recent Activity</h3>
            <div id="activityLog"></div>
        </div>
    </div>

    <script>
        function loadStats() {
            fetch('bot-stats.json')
                .then(response => response.json())
                .then(data => {
                    // Update stats
                    document.getElementById('totalVisits').textContent = data.stats.totalVisits || 0;
                    document.getElementById('totalClicks').textContent = data.stats.totalClicks || 0;
                    document.getElementById('totalScrolls').textContent = data.stats.totalScrolls || 0;
                    document.getElementById('sessionsCompleted').textContent = data.stats.sessionsCompleted || 0;
                    document.getElementById('mobileVisits').textContent = data.stats.mobileVisits || 0;
                    document.getElementById('desktopVisits').textContent = data.stats.desktopVisits || 0;
                    document.getElementById('activeProxies').textContent = Object.keys(data.stats.proxyUsage || {}).length;
                    document.getElementById('earnings').textContent = '$' + (data.stats.estimatedEarnings || 0).toFixed(2);

                    // Update activity log
                    const logDiv = document.getElementById('activityLog');
                    logDiv.innerHTML = '';
                    
                    if (data.stats.sessionHistory && data.stats.sessionHistory.length > 0) {
                        data.stats.sessionHistory.slice(-10).reverse().forEach(session => {
                            const logEntry = document.createElement('div');
                            logEntry.className = 'log-entry';
                            const time = new Date(session.timestamp).toLocaleTimeString();
                            logEntry.textContent = `[${time}] Session from proxy: ${session.proxy}`;
                            logDiv.appendChild(logEntry);
                        });
                    } else {
                        logDiv.innerHTML = '<div class="log-entry">Waiting for sessions...</div>';
                    }

                    // Update last refresh time
                    document.querySelector('.auto-refresh p').textContent = 
                        'Last updated: ' + new Date().toLocaleTimeString() + ' (Auto-refresh in 5s)';
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                    document.getElementById('activityLog').innerHTML = 
                        '<div class="log-entry" style="color: #ffcccc;">⚠️ Error loading stats. Make sure bot-stats.json exists.</div>';
                });
        }

        // Load stats on page load
        loadStats();

        // Auto-refresh every 5 seconds
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
